[project]
name = "puredart-tools"
version = "0.1.0"
description = "Host tooling for purenative, puredart and purehermes"
requires-python = ">=3.12"
dependencies = ["pyelftools==0.33"]

[dependency-groups]
dev = ["ruff==0.17.5"]
build = ["cmake==3.31.10"]
blutter = ["requests>=2.32,<3"]
injection = ["frida==17.2.17", "frida-tools>=14,<15"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["build", "dart/third_party", "**/node_modules", "**/.dart_tool", "**/android"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "EXE", "RUF100"]
# Standalone entry points add the shared tools directory before importing it.
ignore = ["E402"]
